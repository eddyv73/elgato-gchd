name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPS: libusb-1.0-0-dev pkg-config

jobs:
  linux:
    name: linux / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $DEPS

      # RelWithDebInfo a proposito: los analisis de flujo de datos de GCC y
      # Clang (-Wmaybe-uninitialized, -Wnonnull) solo corren con el optimizador
      # activo. Un build sin optimizar da verde y oculta defectos reales: asi
      # se encontraron varios de los que arreglo la Fase 1.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGCHD_WERROR=ON

      # set -o pipefail es obligatorio: el shell por defecto de Actions es
      # `bash -e`, sin pipefail, asi que el estado de salida seria el de tee
      # y un build roto pasaria como verde.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      # Sin dispositivo conectado, gchd debe salir 1 con un mensaje claro. Lo
      # que se verifica es que degrada limpio: un codigo >=128 seria una senal
      # (SIGSEGV/SIGABRT) y es precisamente lo que no debe pasar.
      - name: Smoke test
        shell: bash
        run: |
          ./build/src/gchd -h
          set +e
          out=$(./build/src/gchd 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 1 ]; then
            echo "::error::esperaba exit 1 sin dispositivo, obtenido $rc"
            exit 1
          fi
          if ! grep -q 'Unable to find a supported device' <<<"$out"; then
            echo "::error::mensaje inesperado al no encontrar dispositivo"
            exit 1
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Warning report
        if: always()
        shell: bash
        run: |
          count=$(grep -c 'warning:' build.log || true)
          {
            echo "### ${{ matrix.compiler }}: ${count} warnings"
            echo ''
            echo '```'
            grep 'warning:' build.log | sort -u || echo '(ninguno)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    name: linux / asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $DEPS

      # Las clases PSI calculan su tamano y lo empaquetan por separado. El test
      # de contrato detecta la desincronizacion de forma determinista; ASan es
      # la segunda red, para lo que ese test no cubra.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DGCHD_SANITIZE=ON -DGCHD_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    name: linux / clang-tidy + cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $DEPS clang-tidy cppcheck

      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGCHD_BUILD_TESTS=OFF

      # El conjunto de checks esta en .clang-tidy, calibrado contra este arbol
      # y con WarningsAsErrors. Los pocos casos que no se tocan llevan NOLINT
      # con su justificacion en el codigo.
      - name: clang-tidy
        shell: bash
        run: |
          mapfile -t fuentes < <(find src -name '*.cpp' -not -path 'src/gui/*' | sort)
          clang-tidy -p build "${fuentes[@]}"

      - name: cppcheck
        shell: bash
        run: |
          mapfile -t fuentes < <(find src -name '*.cpp' -not -path 'src/gui/*' | sort)
          cppcheck --enable=warning,portability --inline-suppr \
                   --std=c++20 --language=c++ --quiet \
                   --error-exitcode=1 -I src "${fuentes[@]}"

  macos:
    name: macos / clang (informativo)
    runs-on: macos-latest
    # macOS compila y pasa los tests desde que se corrigio el include de
    # libusb, pero compilar no es funcionar: el arbol no tiene ni una guarda
    # de plataforma y nadie ha verificado el driver en macOS con hardware.
    # El job informa sin bloquear la rama; pasa a obligatorio cuando macOS sea
    # un objetivo asumido, no antes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install libusb pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
